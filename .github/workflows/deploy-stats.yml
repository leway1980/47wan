name: deploy-stats

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'js/engine/feedcodes.js'
      - '.github/workflows/deploy-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-stats
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查 Cloudflare secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set yet（尚未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，略過部署）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            # 去掉貼上時多帶的空白或換行；格式不對就直接說明，不把 token 印出來
            T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
            A=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
            if ! printf '%s' "$T" | grep -qE '^[A-Za-z0-9_-]{30,80}$'; then
              echo "::error::CLOUDFLARE_API_TOKEN 格式不對：應該是一串 40 字左右的英數字，只貼 token 本身，不要附上說明文字或指令。"; exit 1
            fi
            if ! printf '%s' "$A" | grep -qE '^[0-9a-f]{32}$'; then
              echo "::error::CLOUDFLARE_ACCOUNT_ID 格式不對：應該是 32 個英數字（0-9、a-f）。"; exit 1
            fi
            echo "::add-mask::$T"
            { echo "CLOUDFLARE_API_TOKEN=$T"; echo "CLOUDFLARE_ACCOUNT_ID=$A"; } >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 驗證 Cloudflare token
        if: steps.gate.outputs.ready == 'true'
        run: |
          # 使用者 token 與帳號 token 的驗證網址不同，兩個都試
          ok=0
          for u in "https://api.cloudflare.com/client/v4/user/tokens/verify" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; do
            r=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$u")
            st=$(printf '%s' "$r" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.success&&j.result?j.result.status:"invalid")}catch{console.log("invalid")}})')
            if [ "$st" = "active" ]; then ok=1; break; fi
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Cloudflare 不認得這個 token（無效、已被 Roll 換掉、或複製到的不是 token 本身）。請到 Cloudflare → My Profile → API Tokens 重新建立一個，在最後一頁按「Copy」按鈕複製，再到 GitHub 更新 CLOUDFLARE_API_TOKEN。"
            exit 1
          fi
          echo "token 有效"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22

      - name: 安裝 wrangler
        if: steps.gate.outputs.ready == 'true'
        working-directory: worker
        run: npm ci

      - name: 建立／找出 D1 資料庫與 KV
        if: steps.gate.outputs.ready == 'true'
        working-directory: worker
        run: |
          D1_ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="wan47");console.log(d?d.uuid:"")')
          if [ -z "$D1_ID" ]; then
            npx wrangler d1 create wan47
            D1_ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="wan47");console.log(d?d.uuid:"")')
          fi
          KV_ID=$(npx wrangler kv namespace list | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>(x.title==="wan47-snap"||x.title.endsWith("-wan47-snap")));console.log(d?d.id:"")')
          if [ -z "$KV_ID" ]; then
            npx wrangler kv namespace create wan47-snap
            KV_ID=$(npx wrangler kv namespace list | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>(x.title==="wan47-snap"||x.title.endsWith("-wan47-snap")));console.log(d?d.id:"")')
          fi
          if [ -z "$D1_ID" ] || [ -z "$KV_ID" ]; then echo "::error::找不到 D1 或 KV id"; exit 1; fi
          sed -e "s/__D1_ID__/$D1_ID/" -e "s/__KV_ID__/$KV_ID/" wrangler.toml.template > wrangler.toml

      - name: 建立資料表
        if: steps.gate.outputs.ready == 'true'
        working-directory: worker
        run: npx wrangler d1 execute wan47 --remote --file schema.sql

      - name: 部署 worker
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        working-directory: worker
        run: |
          set +e
          npx wrangler deploy 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          set -e
          URL=$(grep -oE 'https://wan47-stats\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n1 || true)
          if [ "$code" -ne 0 ] || [ -z "$URL" ]; then
            echo "::error::部署失敗或找不到 workers.dev 網址。若帳號還沒有 workers.dev 子網域：請登入 dash.cloudflare.com → Workers & Pages，開啟一次並選一個子網域，再重跑這個 workflow。"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: 寫入 data/server.json
        if: steps.gate.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          CUR=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync("data/server.json","utf8")).url||"")}catch{console.log("")}')
          if [ "$CUR" = "$URL" ]; then echo "server.json 已是 $URL"; exit 0; fi
          printf '{ "url": "%s" }\n' "$URL" > data/server.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/server.json
          git commit -m "Set stats server URL"
          git pull --rebase origin main
          git push origin HEAD:main
